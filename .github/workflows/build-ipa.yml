name: Build Unsigned IPA

on:
  push:
    branches: [main, master, 'fix/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iPSX2.ipa
    # macOS 14 runners stop on 2026-11-02; macOS 15 still has the same Xcode 16.2.
    runs-on: macos-15        # Apple Silicon runner — fastest for arm64 iOS

    env:
      SCHEME: iPSX2
      BUILD_DIR: ${{ github.workspace }}/build
      ARCHIVE_PATH: ${{ github.workspace }}/build/iPSX2.xcarchive
      IPA_DIR: ${{ github.workspace }}/ipa-staging
      IPA_PATH: ${{ github.workspace }}/iPSX2-unsigned.ipa
      # Same bundle ID as the iPSX2 build already installed on the iPad, so installing
      # this IPA with the same signer replaces that app and keeps its Documents folder.
      IPSX2_BUNDLE_ID: com.thiago.iPSX2

    steps:
      # ──────────────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ──────────────────────────────────────────────────────────────────────────
      # 2. Select Xcode
      # ──────────────────────────────────────────────────────────────────────────
      # Xcode 16.2 is what every earlier build used; newer Xcodes change compiler behaviour.
      - name: Select Xcode 16.2
        run: |
          if [ -d /Applications/Xcode_16.2.app ]; then
            XCODE=Xcode_16.2.app
          else
            XCODE=$(ls /Applications | grep '^Xcode_16' | sort -V | tail -1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      # ──────────────────────────────────────────────────────────────────────────
      # 2b. StikJIT sources for the built-in JIT helper (PlugIns/iPSX2JITHelper.appex)
      # ──────────────────────────────────────────────────────────────────────────
      - name: Fetch StikJIT 1.9.0
        run: sh scripts/fetch_stikjit.sh

      # ──────────────────────────────────────────────────────────────────────────
      # 3. Install build tools
      # ──────────────────────────────────────────────────────────────────────────
      # cmake and xcbeautify come preinstalled on GitHub's macOS images. Homebrew no
      # longer ships bottles for macOS 14, so only fall back to it if one is missing
      # (a full `brew update` + source build took ~20 min and broke ccache setup).
      # ccache was removed for the same reason: its action could not install ccache.
      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v cmake >/dev/null || brew install cmake || true
          command -v xcbeautify >/dev/null || brew install xcbeautify || true
          cmake --version | head -1
          command -v xcbeautify

      # ──────────────────────────────────────────────────────────────────────────
      # 5. CMake configure
      #    FIX: use 'set -o pipefail' so the pipe to tee does NOT swallow cmake's
      #    non-zero exit code. Without this, cmake can fail but the step passes.
      # ──────────────────────────────────────────────────────────────────────────
      - name: CMake configure (Xcode generator, iphoneos SDK)
        working-directory: cpp
        run: |
          set -euo pipefail
          cmake -B ../build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DiPSX2_REAL_DEVICE=ON \
            -DIPSX2_BUNDLE_ID="$IPSX2_BUNDLE_ID" \
            -DIPSX2_VERSION_PATCH="$((100 + GITHUB_RUN_NUMBER))" \
            -DIPSX2_BUILD_NUMBER="$((100 + GITHUB_RUN_NUMBER))" \
            -DUSE_DISCORD_SDK=OFF \
            -DUSE_VULKAN=OFF \
            -DSDL_VULKAN=OFF \
            -DSDL_RENDER_VULKAN=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_GSRUNNER=OFF \
            -DWEBP_BUILD_ANIM_UTILS=OFF \
            -DWEBP_BUILD_CWEBP=OFF \
            -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_GIF2WEBP=OFF \
            -DWEBP_BUILD_IMG2WEBP=OFF \
            -DWEBP_BUILD_VWEBP=OFF \
            -DWEBP_BUILD_WEBPINFO=OFF \
            -DWEBP_BUILD_WEBPMUX=OFF \
            -DWEBP_BUILD_EXTRAS=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            "-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=" \
            --fresh 2>&1 | tee /tmp/cmake_configure.log
          # Verify exit code — 'tee' can swallow it; re-check the log for errors
          if grep -q "^CMake Error" /tmp/cmake_configure.log; then
            echo "❌ CMake configure reported errors (see above)"
            exit 1
          fi
          echo "✅ CMake configure completed successfully"


      # ──────────────────────────────────────────────────────────────────────────
      # 6. Generate compile_commands.json
      #    Xcode generator doesn't emit compile_commands.json; extract it from
      #    the Xcode build log via xcpretty-json-formatter or generate a stub.
      #    NOTE: Ninja + CMAKE_SYSTEM_NAME=iOS cross-compile requires a full
      #    toolchain file and fails without one, so we skip Ninja here.
      # ──────────────────────────────────────────────────────────────────────────
      - name: Generate compile_commands.json (stub)
        run: |
          echo "[]" > "$BUILD_DIR/compile_commands.json"
          echo "Note: full compile_commands.json requires a Ninja iOS toolchain; stub written."

      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands-${{ github.run_number }}
          path: ${{ env.BUILD_DIR }}/compile_commands.json
          retention-days: 30
          if-no-files-found: warn

      # ──────────────────────────────────────────────────────────────────────────
      # 7. Discover the generated .xcodeproj path
      #    Auto-detect instead of hardcoding, in case the project name differs.
      # ──────────────────────────────────────────────────────────────────────────
      - name: Discover xcodeproj
        run: |
          echo "=== Contents of build/ ==="
          ls -la "$BUILD_DIR" || echo "(build dir empty or missing)"

          XCODEPROJ=$(find "$BUILD_DIR" -maxdepth 1 -name "*.xcodeproj" | head -1)
          if [ -z "$XCODEPROJ" ]; then
            echo "❌ No .xcodeproj found in $BUILD_DIR — CMake configure must have failed."
            echo "=== Last 50 lines of cmake log ==="
            tail -50 /tmp/cmake_configure.log || true
            exit 1
          fi

          echo "✅ Found: $XCODEPROJ"
          # Export for subsequent steps
          echo "XCODEPROJ=$XCODEPROJ" >> $GITHUB_ENV

          # List available schemes
          echo "=== Available schemes ==="
          xcodebuild -project "$XCODEPROJ" -list 2>&1 | tee /tmp/xcode_list.txt || true
          grep -q "iPSX2JITHelper" /tmp/xcode_list.txt \
            || { echo "::error title=JIT helper::CMake did not create the iPSX2JITHelper target"; exit 1; }

      # ──────────────────────────────────────────────────────────────────────────
      # 6b. Build the JIT helper on its own first: it compiles in a few minutes, so a
      #     mistake in it fails the job early instead of after the whole emulator.
      # ──────────────────────────────────────────────────────────────────────────
      - name: Build JIT helper (quick check)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODEPROJ" \
            -target iPSX2JITHelper \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify

      # ──────────────────────────────────────────────────────────────────────────
      # 7. Build (unsigned)
      #    A target build, not `xcodebuild archive -scheme`: scheme builds need the iOS
      #    simulator platform of the selected Xcode, which the macOS 15 image doesn't have
      #    for Xcode 16.2 ("Found no destinations"). Device builds only need the SDK.
      #    DEPLOYMENT_POSTPROCESSING strips the binaries the way an archive does.
      # ──────────────────────────────────────────────────────────────────────────
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODEPROJ" \
            -target "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEPLOYMENT_POSTPROCESSING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            2>&1 | xcbeautify
          APP=$(find "$BUILD_DIR" -type d -name "iPSX2.app" -path "*Release-iphoneos*" | head -1 || true)
          if [ -z "$APP" ]; then
            echo "❌ iPSX2.app was not built"
            exit 1
          fi
          echo "✅ Built: $APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # ──────────────────────────────────────────────────────────────────────────
      # 8. Assemble unsigned IPA manually
      #    Payload/ + SwiftSupport/iphoneos/ → zip → .ipa
      # ──────────────────────────────────────────────────────────────────────────
      - name: Assemble unsigned IPA
        run: |
          set -euo pipefail

          # Search for the .app securely across the whole build/archive directory 
          # AND Xcode's DerivedData! CMake + Xcode often isolates archive payloads there.
          APP_PATH="${APP_PATH:-$(find "$BUILD_DIR" ~/Library/Developer/Xcode/DerivedData -name "iPSX2*.app" -type d 2>/dev/null | head -1 || true)}"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Could not find .app in $BUILD_DIR or DerivedData"
            # Just for debugging, let's dump where EVERYTHING is
            find /Users/runner -name "iPSX2*.app" -type d 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$IPA_DIR/Payload"
          mkdir -p "$IPA_DIR/SwiftSupport/iphoneos"

          cp -rP "$APP_PATH" "$IPA_DIR/Payload/"
          APP_NAME=$(basename "$APP_PATH")
          echo "Copied $APP_NAME into Payload/"

          SWIFT_LIBS_DIR="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          FRAMEWORKS_DIR="$IPA_DIR/Payload/$APP_NAME/Frameworks"
          if [ -d "$FRAMEWORKS_DIR" ]; then
            for dylib in "$FRAMEWORKS_DIR"/libswift*.dylib; do
              [ -f "$dylib" ] || continue
              libname=$(basename "$dylib")
              [ -f "$SWIFT_LIBS_DIR/$libname" ] && \
                cp "$SWIFT_LIBS_DIR/$libname" "$IPA_DIR/SwiftSupport/iphoneos/$libname" && \
                echo "  SwiftSupport ← $libname"
            done
          fi

          # The built-in JIT helper must be inside the app, with legacy.js next to it.
          HELPER="$IPA_DIR/Payload/$APP_NAME/PlugIns/iPSX2JITHelper.appex"
          if [ ! -f "$HELPER/iPSX2JITHelper" ] || [ ! -f "$HELPER/legacy.js" ]; then
            echo "::error title=JIT helper::PlugIns/iPSX2JITHelper.appex is missing from the app"
            ls -la "$IPA_DIR/Payload/$APP_NAME" "$IPA_DIR/Payload/$APP_NAME/PlugIns" 2>&1 || true
            exit 1
          fi
          echo "::notice title=JIT helper::$(stat -f%z "$HELPER/iPSX2JITHelper") bytes, $(plutil -extract CFBundleIdentifier raw "$HELPER/Info.plist")"

          cd "$IPA_DIR"
          # -9: maximum compression keeps the IPA as small as possible (some signing
          # services refuse uploads that are bigger than an earlier one); -X drops extra
          # file attributes that only add size.
          zip -qyr -9 -X "$IPA_PATH" Payload SwiftSupport
          echo "✅ IPA assembled: $(du -sh "$IPA_PATH" | cut -f1)"
          # Surface the exact size and the biggest files as annotations (readable via the API).
          echo "::notice title=IPA size::$(stat -f%z "$IPA_PATH") bytes"
          # (|| true: with pipefail, head closing the pipe early must not fail the step)
          find Payload -type f -exec stat -f '%z %N' {} + | sort -rn | head -8 | while read -r sz name; do
            echo "::notice title=Largest files::$sz $name"
          done || true

      # ──────────────────────────────────────────────────────────────────────────
      # 9. Verify IPA structure
      # ──────────────────────────────────────────────────────────────────────────
      - name: Verify IPA structure
        run: |
          echo "=== IPA internal structure (first 35 entries) ==="
          unzip -l "$IPA_PATH" | head -35
          unzip -l "$IPA_PATH" | grep -q "Payload/.*\.app/" \
            && echo "✅ App bundle found inside Payload" \
            || (echo "❌ IPA is malformed" && exit 1)

      # ──────────────────────────────────────────────────────────────────────────
      # 10. Upload IPA artifact
      # ──────────────────────────────────────────────────────────────────────────
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPSX2-unsigned-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          retention-days: 30
          if-no-files-found: error


      # ──────────────────────────────────────────────────────────────────────────
      # 12. Upload full logs on failure
      # ──────────────────────────────────────────────────────────────────────────
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            /tmp/cmake_configure.log
            ~/Library/Logs/DiagnosticReports/
          retention-days: 7
          if-no-files-found: ignore
